<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="lotr.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        .quiz-container {
            max-width: 900px;
            margin: auto;
            margin-top: 10px;
            padding: 20px;
            background-color: #333;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: left;
        }
        /* Chaque question est un groupe de boutons radio (fieldset) */
        .question {
            margin: 0 0 20px;
            padding: 0 10px 10px;
            border: 2px solid transparent;
            border-radius: 10px;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }
        .question legend {
            width: 100%;
            padding: 0;
        }
        .question legend h3 {
            margin: 0 0 10px;
        }
        /* Question oubliée : signalée par une bordure et un message */
        .question.unanswered {
            border-color: #ffb74d;
            background-color: rgba(255, 183, 77, 0.1);
        }
        .missing-message {
            display: none;
            margin: 5px 0 0;
            color: #ffcc80;
            background: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: left;
        }
        .question.unanswered .missing-message {
            display: block;
        }
        .answers {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .answers li {
            margin-bottom: 8px;
        }
        .answers label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }
        .answers label:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
        .answers input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #d4af37;
        }
        .answers input:focus-visible {
            outline: 3px solid #ffd700;
            outline-offset: 2px;
        }
        /* Après correction : les réponses ne sont plus modifiables */
        .quiz-done .answers label {
            cursor: default;
        }
        .quiz-done .answers label:hover {
            background-color: transparent;
        }
        /* Couleurs claires et contrastées sur le fond #333,
           complétées d'un symbole et d'un texte (pas seulement la couleur) */
        .answers label.correct-answer {
            color: #a5e6a0;
            font-weight: bold;
            border-color: #6fbf6a;
            background-color: rgba(111, 191, 106, 0.15);
        }
        .answers label.wrong-answer {
            color: #ffab9f;
            border-color: #e5675a;
            background-color: rgba(229, 103, 90, 0.15);
        }
        .answers label.wrong-answer .answer-text {
            text-decoration: line-through;
        }
        .feedback {
            margin-left: auto;
            font-size: 0.9em;
            font-weight: bold;
            white-space: nowrap;
        }
        .quiz-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        /* Sans cette règle, display: block ci-dessous l'emporterait sur l'attribut hidden */
        .quiz-buttons [hidden] {
            display: none;
        }
        .submit-button,
        .restart-button {
            display: block;
            margin: 20px 0;
            padding: 10px 20px;
            font-size: 1em;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }
        .submit-button {
            background-color: #4e7a2e;
        }
        .submit-button:hover {
            background-color: #3f6425;
        }
        .restart-button {
            background-color: #2d2b24;
            color: #f4e8c1;
            border: 2px solid #d4af37;
        }
        .restart-button:hover {
            color: #ffd700;
            border-color: #ffd700;
        }
        .submit-button:focus-visible,
        .restart-button:focus-visible {
            outline: 3px solid #ffd700;
            outline-offset: 2px;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            color: antiquewhite;
        }
        .result p {
            margin: 0 0 8px;
            padding: 10px;
        }
        .result .score {
            font-size: 1.3em;
        }
    </style>
</head>
<body class="background-image">
    <nav>
        <a href="lotr.html" class="logo">
            <img src="images/anneau.webp" alt="Logo Seigneur des Anneaux" width="128" height="85" />
        </a>
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Ouvrir le menu">
            <span></span><span></span><span></span>
        </button>
        <ul id="nav-links">
            <li><a href="lotr.html">Home</a></li>
            <li><a href="synopsis.html">Description des films</a></li>
            <li><a href="biographies.html">Biographies</a></li>
            <li><a href="carte.html">Carte</a></li>
            <li><a href="evenements.html">Événements Importants</a></li>
            <li><a href="quiz.html" class="active">Quiz</a></li>
        </ul>
    </nav>
    
    <div class="quiz-container">
        <h1>Quiz Seigneur des Anneaux/Hobbit</h1>
        <form id="quiz-form" novalidate>
            <div id="quiz"></div>
            <div class="quiz-buttons">
                <button type="submit" class="submit-button">Soumettre</button>
                <button type="button" class="restart-button" hidden>Recommencer</button>
            </div>
        </form>
        <div id="result" class="result" aria-live="polite"></div>
    </div>
    
        <script>
            const quizData = [
                {
                    question: "Quel est le nom de l'épée de Gandalf ?",
                    answers: ["Andúril", "Narsil", "Glamdring"],
                    correct: "Glamdring"
                },
                {
                    question: "Quel est le nom de la ville d'Elrond ?",
                    answers: ["Lothlórien", "Fondcombe", "Minas Tirith"],
                    correct: "Fondcombe"
                },
                {
                    question: "Qui détruit l'Anneau Unique ?",
                    answers: ["Frodon", "Sam", "Gollum"],
                    correct: "Gollum"
                },
                {
                    question: "Dans le film 'La Communauté de l'anneau', quel âge Bilbon fête-il ?",
                    answers: ["100 ans", "112 ans", "111 ans"],
                    correct: "111 ans"
                },
                {
                    question: "Comment se nomme l'auberge dans laquelle Frodon, Sam, Pippin et Merry doivent retrouver Gandalf ?",
                    answers: ["L'Auberge de Bree", "La Tanière des Loups", "Le Poney Fringant"],
                    correct: "Le Poney Fringant"
                },
                {
                    question: "Où Frodon est-il emmené pour être soigné du poison infligé par la lame de morgul ?",
                    answers: ["En Lothlórien", "Dans la Forêt Noire", "A Fondcombe"],
                    correct: "A Fondcombe"
                },
                {
                    question: "Dans le Seigneur des Anneaux, pourquoi Boromir essaye-t-il de récupérer l'anneau ?",
                    answers: ["Pour le détruire", "Pour servir Sauron", "Pour l'utiliser contre Sauron"],
                    correct: "Pour l'utiliser contre Sauron"
                },
                {
                    question: "Combien de membres contient la Communauté de l'anneau à l'origine ?",
                    answers: ["7", "9", "13"],
                    correct: "9"
                },
                {
                    question: "Pourquoi la communauté décide-t-elle de passer par les mines de la Moria ?",
                    answers: ["Pour échapper aux armées de Sauron", "Pour échapper à Saroumane", "Car c'est un chemin plus rapide pour le Mordor"],
                    correct: "Pour échapper à Saroumane"
                },
                {
                    question: "Quel est l'autre nom de la Moria en Khuzdul (langue naine) ?",
                    answers: ["Amon Sûl", "Khazad-dûm", "Khizdîn-Sûl"],
                    correct: "Khazad-dûm"
                },
    
    
                //Questions sur le Hobbit
                {
                    question: "La compagnie de Thorin Ecu-de-Chêne se compose :",
                    answers: ["De 15 nains, de 3 hobbits et de 6 magiciens", "De 13 nains, d'un hobbit et d'un magicien", "De 2 nains, d'un homme et d'un elfe"],
                    correct: "De 13 nains, d'un hobbit et d'un magicien"
                },
                {
                    question: "Comment s'appelle le frère aîné de Dwalin ?",
                    answers: ["Gârlin", "Bâlin", "Fûndin"],
                    correct: "Bâlin"
                },
                {
                    question: "En quelle année Smaug le dragon a-t-il attaqué Erebor ?",
                    answers: ["2458", "2143", "1956"],
                    correct: "2143"
                },
                {
                    question: "Qui possédait l'anneau unique avant que Bilbo ne mette la main dessus ?",
                    answers: ["Gollum", "Follum", "Hollum"],
                    correct: "Gollum"
                },
                {
                    question: "Comment s'appelle le fils d'Azog, lieutenant de Sauron ?",
                    answers: ["Tolg", "Bolg", "Sholg"],
                    correct: "Bolg"
                },
                {
                    question: "Comment s'appelle le roi des elfes de Mirkwood ?",
                    answers: ["Thranduil", "Shranduilus", "Xhranduilys"],
                    correct: "Thranduil"
                },
                {
                    question: "Qui meurt aux côtés de Thorin pendant la bataille des cinq armées ?",
                    answers: ["Bâlin et Dwalin", "Kili et Fili", "Beorn et Radagast"],
                    correct: "Kili et Fili"
                },
                {
                    question: "Comment s'appelle la pierre qui pourrait réunir les peuples de Dûrin ?",
                    answers: ["Arkenstone", "Gemme bleue", "Philosopherstone"],
                    correct: "Arkenstone"
                },
                {
                    question: "Où se trouvent les tombes des Neufs ?",
                    answers: ["Monts Brumeux", "Monts du Rhûdaur", "Monts Blancs"],
                    correct: "Monts du Rhûdaur"
                },
                {
                    question: "Qui est Bard l'Archer ?",
                    answers: ["Un bachelier", "Un batelier", "Un marchand"],
                    correct: "Un batelier"
                }
    
            ];
    
            const quizForm = document.getElementById('quiz-form');
            const quizContainer = document.getElementById('quiz');
            const submitButton = quizForm.querySelector('.submit-button');
            const restartButton = quizForm.querySelector('.restart-button');
            const resultContainer = document.getElementById('result');

            // Crée une question : un groupe de boutons radio (fieldset + legend)
            function loadQuiz() {
                quizData.forEach((currentQuestion, questionIndex) => {
                    const fieldset = document.createElement('fieldset');
                    fieldset.classList.add('question');

                    const legend = document.createElement('legend');
                    const questionTitle = document.createElement('h3');
                    questionTitle.textContent = `${questionIndex + 1}. ${currentQuestion.question}`;
                    legend.appendChild(questionTitle);
                    fieldset.appendChild(legend);

                    const answersList = document.createElement('ul');
                    answersList.classList.add('answers');

                    currentQuestion.answers.forEach(answer => {
                        const answerItem = document.createElement('li');
                        const answerLabel = document.createElement('label');

                        const input = document.createElement('input');
                        input.type = 'radio';
                        input.name = `question${questionIndex}`;
                        input.value = answer;
                        // Répondre à une question oubliée enlève le signalement
                        input.addEventListener('change', () => fieldset.classList.remove('unanswered'));

                        const text = document.createElement('span');
                        text.classList.add('answer-text');
                        text.textContent = answer;

                        answerLabel.append(input, text);
                        answerItem.appendChild(answerLabel);
                        answersList.appendChild(answerItem);
                    });

                    const missing = document.createElement('p');
                    missing.classList.add('missing-message');
                    missing.textContent = '⚠ Vous n\'avez pas répondu à cette question.';

                    fieldset.append(answersList, missing);
                    quizContainer.appendChild(fieldset);
                });
            }

            // Ajoute un symbole et un texte à une réponse corrigée
            function addFeedback(label, text) {
                const feedback = document.createElement('span');
                feedback.classList.add('feedback');
                feedback.textContent = text;
                label.appendChild(feedback);
            }

            function getAppreciation(score, total) {
                const ratio = score / total;
                if (ratio === 1) return 'Sans faute ! Même Gandalf serait impressionné.';
                if (ratio >= 0.75) return 'Très beau score, digne d\'un membre de la Communauté !';
                if (ratio >= 0.5) return 'Pas mal ! Encore un peu de lecture à Fondcombe ?';
                return 'Le chemin est encore long… Les biographies et les synopsis peuvent vous aider !';
            }

            function showResult(lines) {
                resultContainer.replaceChildren(...lines.map(([text, className]) => {
                    const p = document.createElement('p');
                    p.textContent = text;
                    if (className) p.classList.add(className);
                    return p;
                }));
            }

            function submitQuiz(event) {
                event.preventDefault();
                const questions = quizContainer.querySelectorAll('.question');

                // 1. Vérifier que toutes les questions ont une réponse
                const unanswered = [];
                questions.forEach((fieldset, questionIndex) => {
                    const answered = fieldset.querySelector(`input[name="question${questionIndex}"]:checked`);
                    fieldset.classList.toggle('unanswered', !answered);
                    if (!answered) unanswered.push(questionIndex + 1);
                });

                if (unanswered.length > 0) {
                    const plural = unanswered.length > 1;
                    showResult([[`Il vous reste ${unanswered.length} question${plural ? 's' : ''} sans réponse `
                        + `(n° ${unanswered.join(', ')}). Répondez-y avant de soumettre.`]]);
                    const first = questions[unanswered[0] - 1];
                    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    first.querySelector('input').focus({ preventScroll: true });
                    return;
                }

                // 2. Corriger
                let score = 0;
                quizData.forEach((currentQuestion, questionIndex) => {
                    quizContainer.querySelectorAll(`input[name="question${questionIndex}"]`).forEach(input => {
                        const label = input.parentElement;
                        if (input.value === currentQuestion.correct) {
                            label.classList.add('correct-answer');
                            addFeedback(label, input.checked ? '✓ Bonne réponse' : '✓ La bonne réponse');
                            if (input.checked) score++;
                        } else if (input.checked) {
                            label.classList.add('wrong-answer');
                            addFeedback(label, '✗ Votre réponse');
                        }
                        input.disabled = true; // On ne peut plus changer après correction
                    });
                });

                quizForm.classList.add('quiz-done');
                submitButton.hidden = true;
                restartButton.hidden = false;
                showResult([
                    [`Vous avez obtenu ${score} bonne${score > 1 ? 's' : ''} réponse${score > 1 ? 's' : ''} sur ${quizData.length}.`, 'score'],
                    [getAppreciation(score, quizData.length)]
                ]);
                resultContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
                restartButton.focus({ preventScroll: true });
            }

            // Remet le quiz à zéro et remonte à la première question
            function restartQuiz() {
                quizContainer.replaceChildren();
                loadQuiz();
                quizForm.classList.remove('quiz-done');
                submitButton.hidden = false;
                restartButton.hidden = true;
                resultContainer.replaceChildren();
                quizForm.scrollIntoView({ behavior: 'smooth' });
                quizContainer.querySelector('input').focus({ preventScroll: true });
            }

            quizForm.addEventListener('submit', submitQuiz);
            restartButton.addEventListener('click', restartQuiz);
            loadQuiz();
        </script>

        <p id="noteFinale">Site Web fait par Tiphaine Chapuis - Ecole Ada Tech School</p>
    <script src="lotr.js"></script>
</body>
</html>
