<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte interactive de la Terre du Milieu – L'Anneau du Savoir</title>
    <meta name="description" content="Carte interactive de la Terre du Milieu : la Comté, Fondcombe, le Gondor, Minas Tirith, le Mordor et la Montagne Solitaire.">
    <link rel="stylesheet" href="lotr.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body class="background-image">
    <script src="nav.js"></script>
    
    <div class="interactive-map">
        <h1>Carte Interactive de la Terre du Milieu</h1>
            <div id="map"></div>

            <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
            <script>
                // Définition des dimensions de l'image de la carte
                var imageWidth = 2000; // Largeur de l'image en pixels
                var imageHeight = 1500; // Hauteur de l'image en pixels

                // Définition des limites de la carte
                let southWest = L.latLng(-imageHeight / 2, -imageWidth / 2),
                northEast = L.latLng(imageHeight / 2, imageWidth / 2),
                bounds = L.latLngBounds(southWest, northEast);

                // Initialisation la carte
                let map = L.map('map', {
                    crs: L.CRS.Simple,
                    maxBounds: bounds,
                    maxBoundsViscosity: 1.0,
                    minZoom: -2,
                    maxZoom: 2
                }).setView([0, 0], 0);

                // Image de la carte comme couche
                let imageUrl = 'images/carte_terre_milieu.jpg'; // Chemin vers l'image de carte
                L.imageOverlay(imageUrl, bounds).addTo(map);

                // Lieux importants : position sur l'image, description et événements qui s'y passent.
                // L'identifiant (id) permet d'ouvrir la carte sur un lieu : carte.html#fondcombe
                const lieux = [
                    {
                        id: 'comte', nom: 'La Comté', position: [330, -500],
                        description: 'Havre de paix pour les Hobbits.',
                        evenements: [
                            ['le-depart-de-bilbon', 'Le Départ de Bilbon'],
                            ['la-decouverte-de-l-anneau', 'La Découverte de l\'Anneau'],

                            ['le-retour-a-la-comte', 'Le Retour à la Comté']
                        ]
                    },
                    {

                        evenements: [

                    {

                        ]
                    },

                        ]
                    },
                    {
                        id: 'minas-tirith', nom: 'Minas Tirith', position: [-300, 300],
                        description: 'La Cité Blanche.',
                        evenements: [
                            ['la-bataille-des-champs-du-pelennor', 'La Bataille des Champs du Pelennor'],
                            ['le-siege-de-minas-tirith', 'Le Siège de Minas Tirith'],
                            ['le-couronnement-d-aragorn', 'Le Couronnement d\'Aragorn']
                        ]
                    },
                    {
                        id: 'havres-gris', nom: 'Les Havres Gris', position: [380, -645],
                        description: 'Port des Elfes, d\'où les navires partent vers les Terres Immortelles.',
                        evenements: [
                            ['le-retour-a-la-comte', 'Le Retour à la Comté']
                        ]
                    },
                    {
                        id: 'bree', nom: 'Bree', position: [353, -363],
                        description: 'Village des Hommes et des Hobbits, avec son auberge du Poney Fringant.',

                        ]
                    },
                    {
                        id: 'repaire-des-trolls', nom: 'Le repaire des Trolls', position: [410, -80],
                        description: 'Collines boisées où se cachent trois trolls des montagnes.',
                        evenements: [
                            ['la-rencontre-avec-les-trolls', 'La Rencontre avec les Trolls']
                        ]
                    },
                    {

                        evenements: [
                            ['la-traversee-des-monts-brumeux', 'La Traversée des Monts Brumeux'],

                    {

                    },
                    {

                    {

                        description: 'Forêt ancienne, domaine des Ents et de Sylvebarbe.',

                        ]
                    },
                    {

                        evenements: [
                            ['la-bataille-du-gouffre-de-helm', 'La Bataille du Gouffre de Helm']
                        ]
                    },
                    {
                        id: 'edoras', nom: 'Edoras', position: [-212, -20],
                        description: 'Capitale du Rohan, où se dresse le palais doré de Meduseld.',
                        evenements: []

                    {

                            ['la-separation-de-la-communaute', 'La Séparation de la Communauté']
                        ]
                    },
                    {
                        id: 'ithilien', nom: 'L\'Ithilien', position: [-420, 300],
                        description: 'Région boisée du Gondor, au pied des montagnes du Mordor.',
                        evenements: [
                            ['la-rencontre-avec-faramir', 'La Rencontre avec Faramir']
                        ]
                    },
                    {
                        id: 'porte-noire', nom: 'La Porte Noire', position: [-140, 430],
                        description: 'Le Morannon, la grande porte qui ferme l\'entrée du Mordor.',
                        evenements: [
                            ['la-bataille-de-la-porte-noire', 'La Bataille de la Porte Noire']
                        ]
                    },
                    {
                        id: 'montagne-du-destin', nom: 'La Montagne du Destin', position: [-265, 447],
                        description: 'Volcan où l\'Anneau Unique a été forgé, le seul endroit où il peut être détruit.',
                        evenements: [
                            ['la-destruction-de-l-anneau', 'La Destruction de l\'Anneau']
                        ]
                    },
                    {
                        id: 'mordor', nom: 'Mordor', position: [-350, 600],
                        description: 'Le pays du mal.',
                        evenements: [
                            ['la-bataille-de-la-porte-noire', 'La Bataille de la Porte Noire'],
                            ['la-destruction-de-l-anneau', 'La Destruction de l\'Anneau']
                        ]
                    }
                ];

                // Contenu d'une bulle : nom, description et liens vers les événements
                function contenuBulle(lieu) {
                    const div = document.createElement('div');
                    div.className = 'bulle-lieu';

                    const titre = document.createElement('strong');
                    titre.textContent = lieu.nom;
                    const description = document.createElement('p');
                    description.textContent = lieu.description;
                    div.append(titre, description);

                    if (lieu.evenements.length) {
                        const intro = document.createElement('p');
                        intro.className = 'bulle-intro';
                        intro.textContent = 'Ce qui s\'y passe :';
                        const liste = document.createElement('ul');
                        lieu.evenements.forEach(([id, nom]) => {
                            const item = document.createElement('li');
                            const lien = document.createElement('a');
                            lien.href = 'evenements.html#' + id;
                            lien.textContent = nom;
                            item.appendChild(lien);
                            liste.appendChild(item);
                        });
                        div.append(intro, liste);
                    }
                    return div;
                }

                // L représente l'objet Leaflet global ; marker() crée un marqueur
                const marqueurs = {};
                lieux.forEach(lieu => {
                    marqueurs[lieu.id] = L.marker(lieu.position, { title: lieu.nom, alt: lieu.nom })
                        .addTo(map)
                        .bindPopup(() => contenuBulle(lieu));
                });

                // carte.html#fondcombe : centre la carte sur le lieu et ouvre sa bulle
                function ouvrirLieuDepuisAdresse() {
                    const id = decodeURIComponent(window.location.hash.slice(1));
                    const lieu = lieux.find(l => l.id === id);
                    if (lieu) {
                        map.setView(lieu.position, 1);
                        marqueurs[lieu.id].openPopup();
                        document.getElementById('map').scrollIntoView({ block: 'center' });
                    }
                }
                ouvrirLieuDepuisAdresse();
                window.addEventListener('hashchange', ouvrirLieuDepuisAdresse);

            </script>
    </div>

    <p id="noteFinale">Site Web fait par Tiphaine Chapuis - École Ada Tech School</p>

</body>
</html>
